# Pack démo client — images préconstruites (Docker Hub), sans sources.
# Prérequis : Docker Desktop / Docker Engine + Compose v2
# Install : copier .env.example → .env, adapter, puis :
#   docker compose pull
#   docker compose up -d

name: pulse-demo

services:
  mysql:
    image: mysql:8.4
    container_name: pulse-demo-mysql
    restart: unless-stopped
    ports:
      # Host 3307 → container 3306 (évite le conflit avec un MySQL local sur 3306)
      - "${MYSQL_HOST_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-pulse_demo_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-backupcontent}
      MYSQL_USER: ${MYSQL_USER:-backup}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-backup}
    volumes:
      - pulse-demo-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  python-extractor:
    image: ${DOCKERHUB_USER}/${PYTHON_IMAGE_NAME:-pulse-python}:${IMAGE_TAG:-demo}
    container_name: pulse-demo-python
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      USE_OPENAI: ${USE_OPENAI:-false}
      DOCUMENT_AI_USE_AI: ${DOCUMENT_AI_USE_AI:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 25s

  api:
    image: ${DOCKERHUB_USER}/${API_IMAGE_NAME:-pulse-api}:${IMAGE_TAG:-demo}
    container_name: pulse-demo-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      python-extractor:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-backupcontent}
      MYSQL_USER: ${MYSQL_USER:-backup}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-backup}
      Jwt__Key: ${JWT_KEY:-ChangeMe_DemoSecretKey_AtLeast32Chars!!}
      AuthSeed__Enabled: "true"
      AuthSeed__Email: ${DEMO_ADMIN_EMAIL:-admin@demo.local}
      AuthSeed__Password: ${DEMO_ADMIN_PASSWORD:-DemoAdmin123!}
      AuthSeed__Name: ${DEMO_ADMIN_NAME:-Admin}
      AuthSeed__FamilyName: ${DEMO_ADMIN_FAMILY_NAME:-Demo}
      AuthSeed__ForceResetPassword: ${DEMO_FORCE_RESET:-false}
      TenancySeed__DefaultCompanyName: ${DEMO_COMPANY_NAME:-Société principale}
      TenancySeed__DefaultTenantName: ${DEMO_TENANT_NAME:-Tenant principal}
      TenancySeed__DefaultModules: ${DEMO_MODULES:-core}
      PythonExtractor__Url: http://python-extractor:8000
      PythonExtractor__Enabled: "true"
      Database__ApplyMigrationsOnStartup: "true"
      UseHttpsRedirection: "false"
      StoreChat__BrandName: ${STORE_BRAND_NAME:-Pulse}
      StoreChat__ReturnBaseUrl: ${PUBLIC_BASE_URL:-http://localhost}
      Stripe__SecretKey: ${STRIPE_SECRET_KEY:-}
      Stripe__PublishableKey: ${STRIPE_PUBLISHABLE_KEY:-}
      # ERP client optionnel — laisser vide / false en démo pure
      ErpSync__Enabled: ${ERP_SYNC_ENABLED:-false}
    volumes:
      - pulse-demo-storage:/app/Storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 90s

  nginx:
    image: nginx:alpine
    container_name: pulse-demo-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  pulse-demo-mysql:
  pulse-demo-storage:
