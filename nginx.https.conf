# HTTPS optionnel pour le LAN (supprime l'avertissement Chrome après confiance au certificat).
# Usage :
#   1. .\scripts\generate-lan-certs.ps1
#   2. Copier/renommer : copy nginx.https.conf nginx.conf
#      OU monter ce fichier dans docker-compose (voir commentaire ci-dessous)
#   3. docker compose up -d nginx
#
# docker-compose volume alternatif :
#   - ./nginx.https.conf:/etc/nginx/nginx.conf:ro
#   - ./certs:/etc/nginx/certs:ro
#   ports: "80:80", "443:443"

events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name euro13 localhost;

        # Redirige vers HTTPS (décommenter si souhaité)
        # return 301 https://$host$request_uri;

        location ~ ^/api/(erp-products/(import-excel|sync-all|sync-catalog|sync-cancel|rebuild-catalog)|store-chat) {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            client_max_body_size 100M;
        }

        location /hubs/ {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            client_max_body_size 10M;
        }

        location / {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
            client_max_body_size 100M;
        }
    }

    server {
        listen 443 ssl;
        server_name euro13 localhost;

        ssl_certificate     /etc/nginx/certs/euro13.crt;
        ssl_certificate_key /etc/nginx/certs/euro13.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location ~ ^/api/(erp-products/(import-excel|sync-all|sync-catalog|sync-cancel|rebuild-catalog)|store-chat) {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            client_max_body_size 100M;
        }

        location /hubs/ {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 3600;
            proxy_send_timeout 3600;
            client_max_body_size 10M;
        }

        location / {
            proxy_pass         http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_read_timeout 300;
            proxy_send_timeout 300;
            client_max_body_size 100M;
        }
    }
}
