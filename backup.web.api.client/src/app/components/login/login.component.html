<div class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="brand-title">DocManager Pro</span>
      <span class="brand-sub">{{ 'login.brandSub' | t }}</span>
    </div>

    <div class="lang-switch login-lang" [attr.aria-label]="'common.lang' | t">
      <button type="button"
              *ngFor="let l of i18n.languages"
              class="lang-btn"
              [class.active]="i18n.lang === l.code"
              (click)="setLanguage(l.code)">{{ l.label }}</button>
    </div>

    <h1>{{ 'login.title' | t }}</h1>
    <p class="login-hint">{{ 'login.hint' | t }}</p>

    <form class="login-form" (ngSubmit)="submit()" autocomplete="on">
      <label class="field">
        <span>{{ 'login.email' | t }}</span>
        <input type="email"
               name="username"
               [(ngModel)]="username"
               placeholder="admin@eurobrico.local"
               [disabled]="loading"
               required
               autocomplete="username" />
      </label>

      <label class="field">
        <span>{{ 'login.password' | t }}</span>
        <div class="password-wrap">
          <input [type]="hidePassword ? 'password' : 'text'"
                 name="password"
                 [(ngModel)]="password"
                 placeholder="••••••••"
                 [disabled]="loading"
                 required
                 autocomplete="current-password" />
          <button type="button"
                  class="toggle-pass"
                  (click)="hidePassword = !hidePassword"
                  [attr.aria-label]="hidePassword ? ('common.show' | t) : ('common.hide' | t)">
            <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
          </button>
        </div>
      </label>

      <div class="login-error" *ngIf="error">{{ error }}</div>

      <button class="btn-primary login-submit" type="submit" [disabled]="loading">
        <mat-icon>{{ loading ? 'hourglass_top' : 'login' }}</mat-icon>
        {{ loading ? ('login.submitting' | t) : ('login.submit' | t) }}
      </button>
    </form>
  </div>
</div>
